[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-hub-saas"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "psycopg[binary,pool]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "rq==2.6.0",
  "sqlalchemy==2.0.43",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
  "xlrd==2.0.2",
]

[project.scripts]
marketplace-hub-create-platform-admin = "marketplace_hub_core.auth.bootstrap:main"

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[tool.setuptools.packages.find]
where = ["packages/core/src", "services/api/src", "services/worker/src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["packages/core/src", "services/api/src", "services/worker/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
