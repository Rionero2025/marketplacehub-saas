[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-hub-saas"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic-settings==2.10.1",
  "redis==6.4.0",
  "rq==2.6.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[tool.setuptools.packages.find]
where = ["packages/core/src", "services/api/src", "services/worker/src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["packages/core/src", "services/api/src", "services/worker/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
