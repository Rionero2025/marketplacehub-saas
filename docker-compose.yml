services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace_hub
      POSTGRES_USER: marketplace_hub
      POSTGRES_PASSWORD: local-dev-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_hub -d marketplace_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8501:10000"
    environment:
      PORT: "10000"
      MARKETPLACE_HUB_DB_ENGINE: postgresql
      DATABASE_URL: postgresql://marketplace_hub:local-dev-password@db:5432/marketplace_hub
      MARKETPLACE_HUB_MASTER_KEY: local-development-master-key-change-me
      MARKETPLACE_HUB_REQUIRE_AUTH: "true"
      MARKETPLACE_HUB_ADMIN_USERNAME: admin
      MARKETPLACE_HUB_ADMIN_PASSWORD: change-me-now
      TZ: Europe/Rome
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
